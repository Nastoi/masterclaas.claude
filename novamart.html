<body><a class="skip-link" href="#mainContent">Skip to main content</a><div class="shell"><header class="top"><div class="brand"><div class="mark">n</div>Novamart <span style="color:#9aa59e;font-weight:400">×</span> Claude learning path</div><div class="top-right"><span><b>Beginner</b> · 5 story lessons + assessment <span class="progress" role="progressbar" aria-label="Learning path progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="topProgress" style="width:0%"></i></span></span></div></header><main class="main-content" id="mainContent" tabindex="-1"><section class="hero"><div><div class="eyebrow">A guided, hands-on story</div><h1>Meet Claude at Novamart</h1><p>Help Maya turn a busy store day into a smoother one, one small lesson at a time.</p></div><div class="hero-art"><div class="spark">✦</div><div class="basket"><div class="fruit"></div></div></div></section><div class="layout"><nav class="side" id="pathNav" aria-label="Learning path"><div class="path-nav-header"><div class="side-title">Your learning path</div><button type="button" id="pathToggle" class="path-menu" aria-controls="chapters" aria-expanded="true" aria-label="Close learning path" title="Close learning path" onclick="togglePath()"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div><div id="chapters"></div></nav><article class="lesson" id="lesson" tabindex="-1" aria-live="polite"></article></div></main><footer class="footer">CLaaS2SaaS Pte Ltd © 2026</footer></div>
<script>
const lessons=[
{title:'A new teammate joins the shift',sub:'Claude Chat for quick help',mins:'2 min',story:'It’s Monday morning at Novamart. Maya, the floor lead, has a long handover note and a queue forming. She needs a quick summary before the team huddle.',body:'<p class="teach"><b>Claude Chat</b> is a good starting point for conversational tasks: explain something, summarize notes, brainstorm, or draft a message. Maya can paste approved handover information, ask for a structure, and refine the result in a back-and-forth conversation. Claude can still make mistakes, so she checks key details.</p><div class="flow"><div class="flow-card"><div class="icon">💬</div><div><b>Chat</b><span>Ask questions and improve a draft through conversation.</span></div></div><div class="flow-card"><div class="icon">🧾</div><div><b>Give context</b><span>Share the relevant approved notes.</span></div></div><div class="flow-card"><div class="icon">👀</div><div><b>Review</b><span>Check names, dates, and assigned tasks.</span></div></div></div><div class="example"><div class="label">Maya’s first request</div>“Summarize these handover notes into urgent tasks, owners, and anything I should verify. Keep it brief.”</div>',q:'Maya wants a quick summary of a handover note and may ask follow-up questions. What should she use?',opts:['Claude Chat, with the approved note included as context.','Claude Code, because every store task needs programming.','An Artifact, before she knows what the summary should say.'],correct:0,hint:'This is a small conversational task using information already in hand.',feedback:'Exactly. Chat is suited to quick questions, summaries, and iterative drafting. Claude Code is for coding work; an Artifact is useful when you need a reusable deliverable.'},
{title:'Give Claude a clear brief',sub:'Projects for repeatable store context',mins:'2 min',story:'Maya’s team repeatedly asks Claude to summarize Novamart’s approved returns guidance and service standards. She wants related reference files and instructions together for future work.',body:'<p class="teach"><b>Projects</b> keep related files, instructions, and context together for recurring work. Maya could create a “Novamart service desk” Project with approved guidance and preferred reply style, then start separate chats for individual tasks. A Project helps Claude use supplied context; it doesn’t make every answer automatically correct.</p><div class="flow"><div class="flow-card"><div class="icon">📁</div><div><b>Project</b><span>Reusable workspace for related work and reference files.</span></div></div><div class="flow-card"><div class="icon">💬</div><div><b>Chats</b><span>Different conversations for each customer or task.</span></div></div><div class="flow-card"><div class="icon">✅</div><div><b>Check</b><span>Confirm the answer follows current approved policy.</span></div></div></div><div class="example"><div class="label">A clear project instruction</div>“Use the approved Novamart service guidance in this Project. If the guidance doesn’t answer a question, say what needs checking instead of guessing.”</div>',q:'The team needs a shared home for approved service references and reusable instructions. Which Claude item fits best?',opts:['A Project, with separate chats for each task.','A single long chat used for every customer forever.','Claude Code, to store customer policies in a program.'],correct:0,hint:'Think reusable context for related work, while keeping individual tasks in their own conversations.',feedback:'Correct. Projects organize persistent context and files for related work, while chats handle individual conversations.'},
{title:'Make sense of the store notes',sub:'Research and connected information',mins:'2 min',story:'A delivery substitution has prompted questions about a supplier’s current product specifications. Maya needs to compare the latest supplier information with Novamart’s approved product notes.',body:'<p class="teach"><b>Research</b> can help investigate a question across available web sources and, where enabled, connected work sources. <b>Connectors</b> link Claude to approved services or information sources, subject to the account setup and permissions. Maya asks for sources and a list of claims to verify; she confirms specifications against the supplier and Novamart’s current records.</p><div class="example"><div class="label">Choose the right approach</div>Use Research when you need a sourced investigation. Use an enabled connector when Claude needs to search approved connected work information. Always verify current product or supplier facts.</div>',q:'Maya needs a sourced comparison of current supplier specifications and approved internal product notes. Which approach is most suitable?',opts:['Use Research for the investigation and an approved connector if internal notes are connected; verify the sources.','Ask a fresh Chat with no sources to guess the differences.','Use an Artifact because it automatically verifies supplier data.'],correct:0,hint:'The task needs sources from outside Novamart and may need a permitted connection to internal information.',feedback:'Right. Research helps gather and compare sourced information; a connector can make approved work sources available when enabled. The team still verifies important facts.'},
{title:'Turn analysis into a useful output',sub:'Analysis and Artifacts',mins:'2 min',story:'The store manager shares a spreadsheet of weekly category sales and asks for a quick view of trends the team can discuss at Monday’s meeting.',body:'<p class="teach"><b>Analysis</b> is useful when Claude needs to inspect a supplied spreadsheet or dataset, calculate patterns, and explain findings. If the team wants a shareable deliverable—such as a chart, dashboard, or small interactive tool—ask Claude to create an <b>Artifact</b>. Maya checks the figures against the source before presenting them.</p><div class="flow"><div class="flow-card"><div class="icon">📊</div><div><b>Analyze</b><span>Explore a supplied dataset and explain patterns.</span></div></div><div class="flow-card"><div class="icon">🧩</div><div><b>Artifact</b><span>Present an output such as a chart or dashboard.</span></div></div><div class="flow-card"><div class="icon">🔎</div><div><b>Verify</b><span>Check calculations and definitions against the source.</span></div></div></div>',q:'The manager wants trends in a supplied sales spreadsheet, then a shareable visual summary. Which sequence fits?',opts:['Use Claude’s analysis capability on the spreadsheet, then ask for an Artifact such as a dashboard; verify the figures.','Use Claude Code to send customer promotions based on the spreadsheet.','Use Research alone; it will know the store’s sales without the file.'],correct:0,hint:'Separate interpreting the information Maya supplied from creating something the manager can share.',feedback:'Exactly. Analysis helps interpret supplied data; an Artifact can turn the findings into a shareable visual deliverable.'},
{title:'Pick the right Claude workspace',sub:'Cowork, Claude Code, and a safe first pilot',mins:'2 min',story:'Novamart’s operations team has one more challenge: each week someone gathers approved store updates from files and connected work apps, then prepares a review pack. Separately, the IT team maintains an internal stock-check tool.',body:'<p class="teach"><b>Cowork</b> is suited to multi-step knowledge work across selected files and connected tools, producing work for a person to review. <b>Claude Code</b> is for software development tasks, such as helping IT update the stock-check tool. Start with a low-risk, approved workflow; don’t grant broad access or automate customer, payment, refund, or policy decisions without the right controls and human review.</p><div class="flow"><div class="flow-card"><div class="icon">🗂️</div><div><b>Cowork</b><span>Coordinate multi-step work across selected files and tools.</span></div></div><div class="flow-card"><div class="icon">⌨️</div><div><b>Claude Code</b><span>Help developers build or maintain software.</span></div></div><div class="flow-card"><div class="icon">🛡️</div><div><b>Review</b><span>People approve consequential decisions and outputs.</span></div></div></div><div class="example"><div class="label">A sensible pilot</div>Prepare a weekly internal operations summary from approved sources, compare it with the originals, and let the manager approve it before sharing.</div>',q:'Which match best fits these Novamart needs?',opts:['Cowork for the multi-step weekly review pack; Claude Code for IT’s stock-check software; a person reviews both outputs.','Claude Code for the weekly review pack; Cowork to write production code without review.','Use connectors to automatically approve refunds, then have Claude Chat explain them.'],correct:0,hint:'One task coordinates information across work tools; the other is software development. Both need a human owner.',feedback:'Correct. Cowork supports multi-step work across selected files and connected tools; Claude Code supports coding. In either case, Novamart sets access and review controls.'}
];
let current=-1,answered=false,attempts=0,unlocked=0,assessmentStep=0,assessmentResults=[],activeSection='overview';
const assessment=[

<section class="start-section" id="start-tools" aria-labelledby="start-tools-title"><h3 class="section-title" id="start-tools-title" tabindex="-1">Three ways to work with Claude</h3><p>Think of these as task patterns. Claude Chat and Cowork capabilities are increasingly combined in one experience, so labels and controls can vary by account, plan, and rollout.</p><div class="options-grid"><div class="option-card"><div class="option-icon">💬</div><h4>Claude Chat · ask and refine</h4><p>Use conversation for explanations, summaries, brainstorming, and drafts based on the context you provide. Ask follow-up questions to improve the result.</p><div class="scenario"><b>Novamart example:</b> Draft a courteous response to a customer using an approved product card. Check facts before sending.</div></div><div class="option-card"><div class="option-icon">🗂️</div><h4>Cowork-style work · complete a multi-step task</h4><p>Use Claude’s knowledge-work capabilities when a task spans selected files or connected apps and needs a finished output for your review. Projects can keep related files and instructions together.</p><div class="scenario"><b>Novamart example:</b> Gather approved weekly updates, compare delivery notes, and prepare a manager’s review pack.</div></div><div class="option-card"><div class="option-icon">⌨️</div><h4>Claude Code · work with software</h4><p>Use Claude Code for coding tasks inside a codebase, such as understanding, changing, or debugging an application. A developer reviews and approves code.</p><div class="scenario"><b>Novamart example:</b> Help the IT team investigate a bug in the stock-check application.</div></div></div></section>
<section class="start-section" id="start-terms" aria-labelledby="start-terms-title"><h3 class="section-title" id="start-terms-title" tabindex="-1">Claude ecosystem terms</h3><div class="glossary"><div class="term"><b>Prompt</b>Your instruction: the task you want Claude to do.</div><div class="term"><b>Context</b>The useful details or files you provide so the answer fits the task.</div><div class="term"><b>Project</b>A workspace for related files, instructions, and ongoing work.</div><div class="term"><b>Research</b>A feature for a deeper investigation across the web and eligible connected sources.</div><div class="term"><b>Connector</b>A link that lets Claude access an approved app or service within its permissions.</div><div class="term"><b>Skill</b>Reusable instructions for doing a specialized task consistently.</div><div class="term"><b>Artifact</b>A deliverable made with Claude, such as a document, chart, dashboard, or interactive tool.</div><div class="term"><b>Claude Code</b>Claude’s coding tool for working with software projects and code.</div></div><div class="caveat">Feature availability, names, and interface can vary by plan, administrator settings, and product rollout. Use only approved data and connected services. Claude can make mistakes; people review important facts and own business decisions.</div></section>

function renderAssessment(){const q=assessment[assessmentStep];if(!q){renderIndex();return}answered=false;attempts=0;document.getElementById('lesson').innerHTML=`<div class="lesson-head"><span class="tag">Summative assessment</span><span class="duration">Question ${assessmentStep+1} of ${assessment.length}</span></div><h2 tabindex="-1">Choose the Claude approach for the scenario</h2><p class="dek">Use what you learned. Each question has two attempts; a hint follows the first miss. Your index gives partial credit for a correct answer after a hint.</p><div class="story"><div class="avatar" aria-hidden="true">🧭</div><div><b>Novamart scenario</b><br>${q.q}</div></div><div class="answers" role="group" aria-label="Answer choices">${answerButtons('assessment',assessmentStep)}</div><div class="feedback" id="feedback" role="status" aria-live="polite" tabindex="-1"></div><div class="assess-count" aria-live="polite">Progress: ${assessmentStep} of ${assessment.length} complete</div><div class="actions"><button type="button" class="btn btn-quiet" onclick="go(${lessons.length+1})">← Review Activity 2</button><button type="button" id="continue" class="btn btn-primary" onclick="assessmentNext()" disabled>Next scenario →</button></div>`}
function assessChoose(i){if(answered)return;attempts++;const q=assessment[assessmentStep],buttons=document.querySelectorAll('.answer'),f=document.getElementById('feedback');f.style.display='block';if(i===displayedCorrect('assessment',assessmentStep)){answered=true;buttons[i].classList.add('correct');assessmentResults.push({correct:true,assisted:attempts>1,why:q.why});f.textContent='✓ Good choice. '+q.why+'\n\nWhy each option:\n'+explainOptions('assessment',assessmentStep);f.focus()}else{buttons[i].classList.add('wrong');buttons[i].disabled=true;if(attempts===1){f.textContent='Not quite. Hint: '+q.hint+' Try once more.';f.focus();return}answered=true;buttons[displayedCorrect('assessment',assessmentStep)].classList.add('correct');assessmentResults.push({correct:false,assisted:true,why:q.why});f.textContent='Review: '+q.why+'\n\nWhy each option:\n'+explainOptions('assessment',assessmentStep);f.focus()}document.getElementById('continue').disabled=false}
function assessmentNext(){if(!answered)return;assessmentStep++;if(assessmentStep<assessment.length){renderAssessment();document.querySelector('#lesson h2')?.focus()}else renderIndex()}
function renderIndex(){let points=0;assessmentResults.forEach(r=>{if(r.correct)points+=r.assisted ? 0.5 : 1});const score=Math.round(points/assessment.length*100);let level,recommendation;if(score<40){level='Explore';recommendation='Build shared AI basics first. Identify approved tools and data rules, then practice with non-sensitive examples.'}else if(score<65){level='Prepare a pilot';recommendation='Choose one low-risk workflow, confirm access and review rules, and give the team guided practice before a live pilot.'}else if(score<85){level='Pilot-ready';recommendation='Run a narrow, supervised pilot with approved sources, a named owner, human review, and measures for time, quality, and rework.'}else{level='Ready to expand carefully';recommendation='The tool choices and safeguards look strong in these scenarios. Expand one workflow at a time, monitor outcomes, and keep owners accountable.'}const reasons=assessmentResults.map((r,i)=>`<li><b>${r.correct?(r.assisted?'Correct after hint':'Correct on first try'):'Needs follow-up'} · Scenario ${i+1}:</b> ${r.why}</li>`).join('');document.getElementById('topProgress').style.width='100%';document.querySelector('.progress').setAttribute('aria-valuenow','100');document.getElementById('lesson').innerHTML=`<div class="completion"><div class="medal" aria-hidden="true">🛒✨</div><div class="tag">Assessment complete</div><h2 tabindex="-1">Novamart AI Adoption Readiness Index</h2><p>This index reflects how well your answers matched the tool choices and safeguards in the scenarios.</p><div class="index-result"><div class="index-number">${score}</div><div class="index-label">${level}</div><div class="index-meter" role="meter" aria-label="AI adoption learning readiness score" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${score}"><i style="width:${score}%"></i></div><p style="margin:7px 0 0;font-size:12px">${points} of ${assessment.length} scenario points · Correct after a hint earns half credit</p></div><h3 style="text-align:left">Recommended next step</h3><p style="text-align:left">${recommendation}</p><h3 style="text-align:left">Why this recommendation</h3><ul class="reason-list">${reasons}</ul><p class="index-disclaimer">This is a learning-based indicator from six scenario answers, not a formal assessment of Novamart’s organizational readiness. Before adoption, leaders should also confirm business ownership, approved data and tools, access controls, staff training, review procedures, and measurable pilot outcomes.</p><div class="actions"><button type="button" class="btn btn-quiet" onclick="go(${lessons.length+1})">← Review Activity 2</button><button type="button" class="btn btn-primary" onclick="restart()">Start again</button></div></div>`;document.querySelector('#lesson h2')?.focus()}
function restart(){current=-1;answered=false;attempts=0;unlocked=0;assessmentStep=0;assessmentResults=[];render()}render();
</script></body></html>
